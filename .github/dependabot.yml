version: 2

updates:
  # Actions are SHA-pinned (see ci.yml). Dependabot understands that pinning
  # and bumps the SHA together with the `# vX.Y.Z` comment, which is what makes
  # SHA-pinning maintainable rather than a slow drift into unpatched actions.
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: 'ci'

  - package-ecosystem: 'uv'
    directory: '/'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: 'deps'
    groups:
      python-dev-tooling:
        patterns: ['ruff', 'mypy', 'pytest*', 'pre-commit', 'pip-audit']

  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: 'deps'
    groups:
      ts-dev-tooling:
        patterns: ['eslint*', '@eslint/*', 'typescript*', 'prettier']

  - package-ecosystem: 'docker'
    directories:
      - '/infra/docker'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: 'deps'
