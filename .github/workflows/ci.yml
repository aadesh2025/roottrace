# RootTrace AI — CI.
#
# Every job invokes a Make target and nothing else. That is the mechanism by
# which `make check` locally and the CI check job cannot diverge (docs/A3 §5.2);
# a job that inlines its own commands here reintroduces the drift.
#
# Actions are pinned by COMMIT SHA, never by tag. A tag is mutable and can be
# re-pointed at arbitrary code by anyone who can push to that repository — the
# same threat that makes us pin dependencies by hash and images by digest
# (docs/11 §11.2, A08). The trailing comment is the human-readable version;
# Dependabot keeps both in step.

name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The coverage ratchet (docs/A3 §6.1). Raise here and in the Makefile
  # together, and only ever upward. 60 from Phase 4 (T1.5).
  ROOTTRACE_COVERAGE_MIN_OVERALL: '60'

jobs:
  check:
    name: check (fmt · lint · typecheck · unit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # >=22.13 is pnpm 11's floor — it needs `node:sqlite`, which Node 20
          # does not have. Keep in step with `engines.node` in package.json.
          node-version: 22

      - name: Enable pnpm
        run: corepack enable pnpm

      - name: Install
        run: make bootstrap

      # The identical target a developer runs before pushing. If this job and
      # `make check` ever test different things, that is the bug.
      - name: make check
        run: make check

  security:
    name: security (gitleaks · pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history. gitleaks scanning only the tip would miss a key that
          # was committed and then "removed" in a later commit — which is the
          # normal shape of this mistake (docs/11 SC29).
          fetch-depth: 0

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Install Python toolchain
        run: uv sync --all-groups

      - name: make audit
        run: make audit

  integration:
    name: integration (RLS + partitions, real Postgres)
    runs-on: ubuntu-latest

    # Redis is not part of the Supabase stack, so CI provides it the platform's
    # own way: a service container, started before any step runs. `make
    # redis-up` is a no-op here and says so, rather than racing this.
    services:
      redis:
        image: redis@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    env:
      # Matches the port `make redis-up` publishes locally, so the same command
      # works in both places.
      RT_REDIS_URL: redis://127.0.0.1:6380/0

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable pnpm

      - name: Install
        run: make bootstrap

      # Brings up the Supabase stack and applies all 15 migrations from empty.
      # The migrations are the thing under test as much as the suite is: the
      # three coverage assertions in ...001500 fail the RESET, not a test, so a
      # missing policy never reaches the assertions below.
      - name: make db-reset
        run: make db-reset

      # `A1` §8 requires this in CI: it confirms every ground-truth reference
      # resolves to real code, so a refactor of the fixtures cannot silently
      # invalidate the evaluation harness. Run before the broader suite so a
      # broken corpus is reported as a broken corpus.
      - name: make fixtures-verify
        run: make fixtures-verify

      - name: make test-integration
        run: make test-integration
