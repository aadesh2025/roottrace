# Pre-commit: format, lint, secret-scan (docs/15 §3, T1.1).
#
# Revisions are pinned to tags and bumped with `pre-commit autoupdate`, never
# left floating. A hook that can change under you is a supply-chain hole
# (docs/11 §13, A08).
#
# Install once per clone:  make bootstrap

default_install_hook_types: [pre-commit, commit-msg]
fail_fast: false

repos:
  # ── Secrets ──────────────────────────────────────────────────────────────
  # First, and deliberately so: a secret caught after formatting has already
  # been written to disk in a staged blob.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      # `gitleaks-system`, not `gitleaks`. The default hook is `language: golang`
      # and pre-commit bootstraps a Go toolchain to build it — which on a machine
      # without Go was observed to abort the whole run and **exit 0 without
      # scanning anything**. A secret scanner that silently does not run is worse
      # than no scanner, because the green tick is what people trust.
      #
      # `-system` requires the binary on PATH and fails loudly when it is absent:
      #   winget install Gitleaks.Gitleaks --version 8.30.1
      #   brew install gitleaks    /    apt-get install gitleaks
      # Keep the installed version in step with `rev` above and with
      # GITLEAKS_IMAGE in the Makefile.
      - id: gitleaks-system
        # The upstream `-system` hook omits this, so pre-commit appends the
        # changed filenames and gitleaks reads them as repository paths
        # ("fatal: cannot change to 'docs\16-ROADMAP.md'"). It scans the staged
        # diff itself; it does not want a file list.
        pass_filenames: false

  # ── Python ───────────────────────────────────────────────────────────────
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.2
    hooks:
      - id: ruff-format
      # `ruff-check`, not the legacy `ruff` alias, which 0.16 deprecates.
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]

  # ── Everything else ──────────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^docs/
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
        exclude: ^(tsconfig|\.prettierrc)\.json$ # these carry comments by design
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=512]
      - id: check-case-conflict # Windows and macOS are case-insensitive; Linux CI is not
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: detect-private-key
