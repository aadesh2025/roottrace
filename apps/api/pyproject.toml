[project]
name = "roottrace-api"
version = "0.1.0"
description = "RootTrace AI — public API (FastAPI). Never holds the service-role key."
requires-python = ">=3.12,<3.13"
# Runtime dependencies arrive with T1.5 (docs/15 §3). Phase 1 is tooling only;
# an unused FastAPI pin added now would be stale before its first import.
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Flat layout, not src/. docs/13 §3 copies `apps/api` to /app and runs
# `uvicorn roottrace_api.main:app`; a src/ layout would break that Dockerfile.
packages = ["roottrace_api"]
