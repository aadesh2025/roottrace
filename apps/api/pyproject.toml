[project]
name = "roottrace-api"
version = "0.1.0"
description = "RootTrace AI — public API (FastAPI). Never holds the service-role key."
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.120,<1.0",
  "uvicorn[standard]>=0.38,<1.0",
  "pydantic-settings>=2.7,<3.0",
  # PyJWT over python-jose: a narrower surface, actively maintained, and jose
  # has a CVE history. `crypto` pulls in `cryptography` for RS256/ES256 (B12).
  "pyjwt[crypto]>=2.10,<3.0",
  "httpx>=0.28,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Flat layout, not src/. docs/13 §3 copies `apps/api` to /app and runs
# `uvicorn roottrace_api.main:app`; a src/ layout would break that Dockerfile.
packages = ["roottrace_api"]
