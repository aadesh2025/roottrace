[project]
name = "roottrace-sandbox-runner"
version = "0.1.0"
description = "RootTrace AI — the process that executes inside the hardened sandbox container."
requires-python = ">=3.12,<3.13"
# Deliberately dependency-free for as long as possible: everything listed here
# is installed inside a container that has no network at run time
# (docs/07 §3 L1) and must resolve entirely from the warmed wheel cache.
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["roottrace_sandbox_runner"]
