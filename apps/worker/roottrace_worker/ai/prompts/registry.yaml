# RootTrace AI — prompt version registry (`A2` §10, `06` §3.3).
#
# A prompt version is never edited in place (see the .md files' own
# headers). Rolling back a regression is editing `current` below, not a
# deploy.

current:
  # Shared L1 (`A2` §2) — not named in `A2` §10's own table, versioned here
  # anyway so it loads through the same mechanism as every other layer
  # rather than being a special case.
  system: v1
  understand: v3
  reason: v3
  patch: v4
  critique: v2
  repair: v1
  pr_description: v2
  schema_repair: v1

history:
  reason:
    v1:
      shipped: 2026-06-01
      retired: 2026-06-18
      note: "single-question format; produced symptom restatements"
    v2:
      shipped: 2026-06-18
      retired: 2026-07-09
      note: "added why-chaining; +14% root-cause accuracy"
    v3:
      shipped: 2026-07-09
      note: "added mandatory hypothesis elimination; +6% accuracy, -8% cost (fewer schema repairs)"
  patch:
    v4:
      shipped: 2026-07-22
      note: "added explicit unacceptable-fix guidance; eliminated silent_default_zero failures entirely"
