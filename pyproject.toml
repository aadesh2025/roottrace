# RootTrace AI — uv workspace root.
#
# This root is not itself a distributable package; it exists to hold the
# workspace definition and the shared tool configuration so that ruff, mypy,
# and pytest cannot diverge between apps/ and packages/.
#
# Stack is fixed by CLAUDE.md and docs/02 §technology. Do not add a dependency
# here without checking docs/appendix/A4-ADR-LOG.md first.

[project]
name = "roottrace"
version = "0.1.0"
description = "RootTrace AI — autonomous API error observatory (workspace root)"
requires-python = ">=3.12,<3.13"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = [
  "apps/api",
  "apps/worker",
  "apps/sandbox-runner",
  "packages/sdk-python",
]

[tool.uv.sources]
roottrace-api = { workspace = true }
roottrace-worker = { workspace = true }
roottrace-sandbox-runner = { workspace = true }
roottrace-sdk = { workspace = true }

[dependency-groups]
# Every workspace member is installed editable into the root venv, so
# `uv run pytest` sees the whole repo without per-package activation.
dev = [
  "roottrace-api",
  "roottrace-worker",
  "roottrace-sandbox-runner",
  "roottrace-sdk",
  # Exact versions are pinned by uv.lock with hashes (docs/11 A08).
  # Keep this range in step with the ruff-pre-commit `rev` in
  # .pre-commit-config.yaml. If the hook and the toolchain resolve to different
  # ruff versions, `make fmt` and the commit hook can disagree about the same
  # file and fight each other on every commit.
  "ruff>=0.16,<0.17",
  "mypy>=1.18,<2.0",
  # >=9.0.3: 8.4.2 carries PYSEC-2026-1845, caught by `make audit` on the first
  # run. The original <9.0 ceiling would have pinned us below the fix.
  "pytest>=9.0.3,<10.0",
  "pytest-asyncio>=1.2,<2.0",
  "pytest-cov>=7.0,<8.0",
  "pre-commit>=4.4,<5.0",
  "pip-audit>=2.9,<3.0",
  # Integration tests talk to the Supabase-managed Postgres directly: the schema
  # depends on Supabase roles and the auth schema, which a bare testcontainer
  # does not have (deviation from `14` §4, noted there).
  "psycopg[binary]>=3.3.4,<4.0",
  "httpx>=0.28",
  # mypy --strict stub for T5.1's `ai/routing.py` (`yaml.safe_load`).
  "types-PyYAML>=6.0,<7.0",
  # mypy --strict stub for T5.4's `pipeline/patch/diffing.py` (`unidiff`).
  "types-unidiff>=0.7,<1.0",
]

# ── ruff ───────────────────────────────────────────────────────────────────

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
  # ruff formats Python inside Markdown fences from 0.16. The specification is
  # binding and hand-formatted (CLAUDE.md), and its code blocks are contracts —
  # A3 §6's boot invariants, 04 §12's DDL. A formatter rewriting them produces
  # a huge diff that hides real contract changes, which is the definition of
  # documentation drift becoming a defect.
  "docs",
  # The fixture repo's flaws are the point. Formatting it would move the very
  # line numbers the 25 ground-truth cases cite.
  "fixtures/synthetic-repo",
]

[tool.ruff.lint]
select = [
  "E", "W",    # pycodestyle
  "F",         # pyflakes
  "I",         # isort
  "N",         # pep8-naming — snake_case is a convention in CLAUDE.md
  "UP",        # pyupgrade
  "B",         # bugbear
  "S",         # bandit — untrusted input is a first-class concern here
  "ASYNC",     # async correctness
  "C4",        # comprehensions
  "SIM",       # simplify
  "TID",       # tidy imports
  "PTH",       # use pathlib
  "RUF",
]
ignore = [
  "E501",      # line length is enforced by the formatter, not the linter
]

[tool.ruff.lint.per-file-ignores]
# Tests legitimately assert, use fixtures, and hard-code sample values.
"**/tests/**" = ["S101", "S105", "S106"]
# N818 wants an `Error` suffix on every exception. These names are the frozen
# contract in docs/08 §7.4 — GC2 names FileNotFound, GC9 AlreadyExists, GC10
# RateLimited, GC11 NoDiff — and the contract tests assert against them by
# name. Renaming for a style rule would put the code and the spec out of step,
# which is the defect this project treats most seriously.
"apps/worker/roottrace_worker/github/errors.py" = ["N818"]
# Same rule, same reasoning, different origin: `ExtractorUnavailable` is named
# to match `TransportUnavailable` above, because the two are the same idea at
# two seams — "the thing this stage would have called does not exist here".
# One of them carrying an `Error` suffix and the other not would make the
# symmetry look accidental.
"apps/worker/roottrace_worker/pipeline/understand/extractor.py" = ["N818"]
# Same rule again: `TenancyViolation` is the exact name `docs/11` §4's own
# `TenantRepository` sketch raises. T5.1's `db.py` implements that class for
# the first time; renaming its exception for a style rule would put the code
# out of step with the one security doc that names it.
"apps/worker/roottrace_worker/ai/db.py" = ["N818"]
# A third instance of the same `XUnavailable` symmetry as line 111 above:
# `ReasonerUnavailable` names the S6 seam the way `ExtractorUnavailable`
# names S4's and `TransportUnavailable` names the GitHub gateway's — one
# idea, three seams, deliberately spelled the same way.
"apps/worker/roottrace_worker/pipeline/reason/reasoner.py" = ["N818"]
# A fourth instance of the same `XUnavailable` symmetry: `PatcherUnavailable`
# names the S7 seam the way the three above name S4, S6, and the GitHub
# gateway's.
"apps/worker/roottrace_worker/pipeline/patch/patcher.py" = ["N818"]
# A fifth instance of the same `XUnavailable` symmetry: `RepairerUnavailable`
# names the S9 seam the way the four above name S4, S6, S7, and the GitHub
# gateway's.
"apps/worker/roottrace_worker/pipeline/repair/repairer.py" = ["N818"]
# A sixth instance of the same `XUnavailable` symmetry: `CriticUnavailable`
# names the S10 seam the way the five above name S4, S6, S7, S9, and the
# GitHub gateway's.
"apps/worker/roottrace_worker/pipeline/critique/critic.py" = ["N818"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[tool.ruff.lint.isort]
# Without this, our own workspace packages sort as third-party and every file
# that imports one gets flagged. Add new workspace members here.
known-first-party = [
  "roottrace_api",
  "roottrace_worker",
  "roottrace_sandbox_runner",
  "roottrace_sdk",
]

# ── mypy ───────────────────────────────────────────────────────────────────

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_unused_configs = true
show_error_codes = true
# Untyped third-party packages are opted in explicitly rather than blanket
# ignored, so a missing stub is a visible decision.
disallow_untyped_defs = true
# The synthetic repo's flaws are the subject under test — type-checking it
# would surface the very defects the pipeline is supposed to find. The trigger
# harness is excluded for a different reason: it imports that repo through a
# runtime `sys.path` insert, which mypy cannot follow and should not, since
# resolving those names would drag the unchecked repo back in.
#
# `conftest.py` is excluded for a third reason, added at T2.5. pytest resolves
# a conftest per directory; mypy resolves modules by name, so a second
# `conftest.py` anywhere in the tree is a hard "Duplicate module named
# conftest" that stops the run before it checks anything. None of mypy's
# suggested fixes work here — adding `__init__.py` still yields two modules
# called `tests.conftest`, and the directories above them (`apps/api`,
# `packages/sdk-python`) cannot be packages, one of them not even being a legal
# identifier. Reshaping the test layout to satisfy the type checker is the
# wrong trade: conftest files hold fixtures, and every test module that uses
# them is still checked in full.
exclude = "(^fixtures/(synthetic-repo|triggers)/|(^|/)conftest\\.py$)"

# ── pytest ─────────────────────────────────────────────────────────────────

[tool.pytest.ini_options]
minversion = "8.0"
# --strict-markers: an unregistered marker is an error, not a silent no-op,
# so `pytest -m unit` can never quietly select nothing because of a typo.
addopts = "-q --strict-markers --strict-config"
testpaths = ["apps", "packages", "tests"]
asyncio_mode = "auto"
markers = [
  "unit: pure functions and mocked boundaries (docs/14 §3)",
  "integration: real Postgres, Redis, containers via testcontainers (docs/14 §4)",
  "security: RLS, sandbox isolation, injection corpus (docs/14 §7)",
  "e2e: full stack through Playwright (docs/14 §5)",
]

# ── coverage ───────────────────────────────────────────────────────────────

[tool.coverage.run]
branch = true
# The PACKAGE directories, not `apps` and `packages`.
#
# Coverage discovers never-imported files by walking each source directory, but
# it only recurses into a subdirectory that contains `__init__.py`. `apps/` does
# not, so nothing under it was ever discovered: the report contained exactly the
# modules some test happened to import, and a module with no tests at all was
# absent rather than 0%. The overall floor could then be satisfied by not
# importing something. Caught when `roottrace_api/serve.py` failed to appear.
#
# Add a line here for each new workspace package.
source = [
  "apps/api/roottrace_api",
  "apps/worker/roottrace_worker",
  "apps/sandbox-runner/roottrace_sandbox_runner",
  "packages/sdk-python/roottrace_sdk",
]
# `tests` is deliberately absent from source: test code is not the thing being
# measured.
# __init__.py is deliberately NOT omitted. It is the usual thing to exclude,
# but package inits hold real exports in this repo, and excluding them here
# would mean Phase 1 measures literally nothing and reports success.
omit = ["**/tests/**"]

[tool.coverage.report]
show_missing = true
skip_covered = true
# Phase 1 measures without enforcing (docs/A3 §6.1). The floor is supplied on
# the command line by the Makefile via ROOTTRACE_COVERAGE_MIN_OVERALL, which is the
# ratchet: it may only ever be raised. Never set a floor here — a second source
# of truth is how a ratchet silently slips.
fail_under = 0
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "@overload",
]
